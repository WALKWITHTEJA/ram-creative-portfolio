<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM — Admin Panel</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#070707;
color:#eee;
font-family:Arial,sans-serif
}

body{
font-size:14px
}

button,input,textarea{
font:inherit
}

button{
cursor:pointer
}

.hidden{
display:none!important
}

.gold{
color:#d9a83b
}

/* LOGIN */

.login{
min-height:100vh;
display:grid;
place-items:center;
background:
radial-gradient(
circle at center,
#251b0b 0%,
#070707 58%
)
}

.login-box{
width:min(430px,92%);
padding:42px;
background:#101010;
border:1px solid #5a421d;
text-align:center;
box-shadow:0 20px 80px rgba(0,0,0,.5)
}

.logo{
font:bold 38px Georgia,serif;
color:#d9a83b;
letter-spacing:5px
}

.login-sub{
color:#777;
font-size:10px;
letter-spacing:3px;
margin:8px 0 25px
}

.field{
width:100%;
padding:13px 14px;
background:#080808;
border:1px solid #392b16;
color:#fff;
margin:7px 0 15px;
outline:none;
border-radius:0
}

.field:focus{
border-color:#d9a83b
}

textarea.field{
resize:vertical;
min-height:110px
}

.login-btn,
.save-btn{
width:100%;
padding:14px;
background:#d9a83b;
color:#111;
border:0;
font-weight:800
}

.login-btn:hover,
.save-btn:hover,
.edit-btn:hover,
.add-btn:hover{
filter:brightness(1.08)
}

.msg{
color:#d66;
font-size:12px;
margin-top:12px
}

/* APP */

.app{
display:flex;
min-height:100vh
}

/* SIDEBAR */

.sidebar{
width:245px;
flex-shrink:0;
background:#101010;
border-right:1px solid #292116;
padding:20px 12px;
display:flex;
flex-direction:column;
gap:5px
}

.sidebar-title{
font:30px Georgia,serif;
color:#d9a83b;
margin:0 0 20px;
padding:10px
}

.nav-btn,
.public-link{
background:none;
border:0;
color:#aaa;
text-align:left;
padding:12px;
text-decoration:none;
display:block;
width:100%
}

.nav-btn:hover,
.nav-btn.active,
.public-link:hover{
background:#1a150c;
color:#e0b34d
}

/* MAIN */

.main{
flex:1;
min-width:0;
padding:26px
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid #292116;
padding-bottom:16px
}

.topbar h1{
margin:0;
font:36px Georgia,serif
}

.live{
color:#d9a83b;
font-size:11px;
letter-spacing:2px
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:14px;
margin-top:20px
}

.card{
background:#111;
border:1px solid #302617;
padding:22px;
min-height:110px
}

.card b{
display:block;
font:38px Georgia,serif;
color:#d9a83b;
margin-bottom:8px
}

/* PANELS */

.panel{
background:#111;
border:1px solid #302617;
padding:22px;
margin-top:18px
}

.panel h2{
margin-top:0;
color:#d9a83b;
font:26px Georgia,serif
}

.hint{
color:#888;
line-height:1.7
}

.notice{
background:#171107;
border:1px solid #5d451d;
color:#d9b86a;
padding:13px;
margin:15px 0;
line-height:1.6
}

/* ITEMS */

.item{
padding:20px 0;
border-bottom:1px solid #302617
}

.item:last-child{
border-bottom:0
}

.actions{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:12px
}

.edit-btn{
background:#d9a83b;
color:#111;
border:0;
padding:10px 14px;
font-weight:800
}

.delete-btn{
background:#4b1717;
color:#fff;
border:0;
padding:10px 14px;
font-weight:800
}

.add-btn{
width:100%;
margin-top:15px;
padding:14px;
background:#d9a83b;
color:#111;
border:0;
font-weight:800
}

.cancel-btn{
background:#333;
color:#fff;
border:0;
padding:12px 18px;
font-weight:700
}

/* STATS */

.stat{
background:#0d0d0d;
border:1px solid #302617;
padding:20px;
margin:15px 0
}

.stat-title{
color:#d9a83b;
font:24px Georgia,serif;
margin-bottom:12px
}

/* PROJECT */

.project{
background:#0d0d0d;
border:1px solid #302617;
padding:20px;
margin:18px 0
}

.project-number{
color:#d9a83b;
font:24px Georgia,serif;
margin-bottom:15px
}

.preview{
width:100%;
max-width:430px;
height:230px;
object-fit:cover;
display:block;
border:1px solid #3b2c18;
margin:10px 0 18px
}

/* FORM */

.form-box{
background:#0d0d0d;
border:1px solid #6e5220;
padding:22px;
margin-top:20px
}

.form-box h2{
margin-top:0
}

.success{
color:#8fd18f;
margin-top:10px
}

/* EMPTY */

.empty{
padding:25px;
border:1px dashed #302617;
color:#777;
text-align:center;
margin-top:15px
}

/* MOBILE */

@media(max-width:760px){

.sidebar{
width:68px;
padding:10px 6px
}

.sidebar-title{
font-size:0;
text-align:center;
padding:10px 0
}

.sidebar-title:after{
content:"R";
font:bold 25px Georgia,serif;
color:#d9a83b
}

.nav-btn,
.public-link{
font-size:0;
text-align:center;
padding:12px 5px
}

.nav-btn:before{
content:"•";
font-size:20px
}

.public-link:before{
content:"↗";
font-size:20px
}

.main{
padding:14px
}

.cards{
grid-template-columns:1fr 1fr
}

.topbar{
flex-direction:column;
align-items:flex-start;
gap:8px
}

.topbar h1{
font-size:28px
}

.panel{
padding:15px
}

}

/* VERY SMALL */

@media(max-width:420px){

.cards{
grid-template-columns:1fr
}

.login-box{
padding:28px 20px
}

}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

</head>

<body>

<!-- =====================================================
LOGIN
===================================================== -->

<div id="login" class="login">

<div class="login-box">

<div class="logo">RAM</div>

<div class="login-sub">
FULL WEBSITE ADMIN
</div>

<input
id="email"
class="field"
type="email"
placeholder="Admin Email"
autocomplete="username"
>

<input
id="password"
class="field"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button
class="login-btn"
onclick="login()">

LOGIN

</button>

<div id="loginMsg" class="msg"></div>

</div>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="app hidden">

<aside class="sidebar">

<h2 class="sidebar-title">RAM</h2>

<button
class="nav-btn active"
onclick="show('dashboard',this)">
Dashboard
</button>

<button
class="nav-btn"
onclick="show('home',this)">
Home / Hero
</button>

<button
class="nav-btn"
onclick="show('stats',this)">
Stats
</button>

<button
class="nav-btn"
onclick="show('projects',this)">
Projects / Proof
</button>

<button
class="nav-btn"
onclick="show('offers',this)">
Offers
</button>

<button
class="nav-btn"
onclick="show('about',this)">
About
</button>

<button
class="nav-btn"
onclick="show('services',this)">
Services
</button>

<button
class="nav-btn"
onclick="show('contact',this)">
Contact
</button>

<button
class="nav-btn"
onclick="show('messages',this)">
Messages
</button>

<button
class="nav-btn"
onclick="show('settings',this)">
Account
</button>

<a
class="public-link"
href="index.html">
Public Website ↗
</a>

<button
class="nav-btn"
onclick="logout()">
Logout
</button>

</aside>


<main class="main">

<div class="topbar">

<h1 id="pageTitle">
Dashboard
</h1>

<span class="live">
LIVE DATABASE CMS
</span>

</div>

<div id="content"></div>

</main>

</div>


<script>

/* =====================================================
SUPABASE
===================================================== */

const db =
window.supabase.createClient(
window.SUPABASE_URL,
window.SUPABASE_ANON_KEY
);


const $ =
id => document.getElementById(id);


/* =====================================================
ESCAPE HTML
===================================================== */

function esc(value){

return String(value ?? "")
.replace(
/[&<>"']/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


/* =====================================================
INPUT HELPERS
===================================================== */

function input(
label,
id,
value="",
type="text"
){

return `

<label>
${esc(label)}
</label>

<input
id="${esc(id)}"
class="field"
type="${esc(type)}"
value="${esc(value)}"
>

`;

}


function textarea(
label,
id,
value=""
){

return `

<label>
${esc(label)}
</label>

<textarea
id="${esc(id)}"
class="field"
rows="4"
>${esc(value)}</textarea>

`;

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

const email =
$("email").value.trim();

const password =
$("password").value;


if(!email || !password){

$("loginMsg").textContent =
"Enter email and password.";

return;

}


const {
error
} =
await db.auth.signInWithPassword({

email:email,
password:password

});


if(error){

$("loginMsg").textContent =
error.message;

return;

}


$("login").classList.add("hidden");
$("app").classList.remove("hidden");


show(
"dashboard",
document.querySelector(".nav-btn")
);

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

await db.auth.signOut();

location.reload();

}


/* =====================================================
NAVIGATION
===================================================== */

async function show(
type,
button
){

document
.querySelectorAll(".nav-btn")
.forEach(
x => x.classList.remove("active")
);


if(button){
button.classList.add("active");
}


const titles={

dashboard:"Dashboard",
home:"Home / Hero",
stats:"Stats",
projects:"Projects / Proof",
offers:"Offers",
about:"About",
services:"Services",
contact:"Contact",
messages:"Messages",
settings:"Account Settings"

};


$("pageTitle").textContent =
titles[type] || "Dashboard";


$("content").innerHTML=`

<div class="panel">

<h2>Loading...</h2>

</div>

`;


/* =====================================================
DASHBOARD
===================================================== */

if(type==="dashboard"){

const [
projects,
services,
offers,
messages
] =
await Promise.all([

db
.from("projects")
.select("id",{count:"exact",head:true}),

db
.from("services")
.select("id",{count:"exact",head:true}),

db
.from("offers")
.select("id",{count:"exact",head:true}),

db
.from("messages")
.select("id",{count:"exact",head:true})

]);


$("content").innerHTML=`

<div class="cards">

<div class="card">
<b>${projects.count ?? 0}</b>
Projects
</div>

<div class="card">
<b>${services.count ?? 0}</b>
Services
</div>

<div class="card">
<b>${offers.count ?? 0}</b>
Offers
</div>

<div class="card">
<b>${messages.count ?? 0}</b>
Messages
</div>

</div>


<div class="panel">

<h2>
Live Website Control
</h2>

<p class="hint">
Changes saved here are stored in Supabase
and displayed on the public website.
</p>

</div>

`;

return;

}


/* =====================================================
HOME
===================================================== */

if(type==="home"){

const {
data,
error
} =
await db
.from("site_content")
.select("*")
.limit(1)
.maybeSingle();


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>Home / Hero</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


const x=data || {};


$("content").innerHTML=`

<div class="panel">

<h2>
Home / Hero
</h2>

${input(
"Hero Eyebrow",
"heroEyebrow",
x.hero_eyebrow
)}

${input(
"Hero Title",
"heroTitle",
x.hero_title
)}

${textarea(
"Hero Description",
"heroDescription",
x.hero_description
)}

<button
class="save-btn"
onclick="saveHome()">

SAVE HOME

</button>

</div>

`;

return;

}


/* =====================================================
STATS — EXACTLY 4
===================================================== */

if(type==="stats"){

const {
data,
error
} =
await db
.from("stats")
.select("*")
.order(
"sort_order",
{ascending:true}
);


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>Stats</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


const existing=data || [];


const defaults=[

{
value:"2+",
label:"PROJECTS",
sort_order:1
},

{
value:"10+",
label:"BRANDS",
sort_order:2
},

{
value:"1+",
label:"YEARS CREATING",
sort_order:3
},

{
value:"100%",
label:"PASSION",
sort_order:4
}

];


let html=`

<div class="panel">

<h2>
Stats
</h2>

<div class="notice">
EXACTLY 4 STATS ONLY.
No Add Stat option.
Edit or delete existing stats.
If a missing stat is saved, it will be created.
</div>

`;


for(let i=0;i<4;i++){

const stat=existing[i];
const d=defaults[i];

const value =
stat?.value ?? d.value;

const label =
stat?.label ?? d.label;

const sort =
stat?.sort_order ?? d.sort_order;

const id =
stat?.id ?? "";


html+=`

<div class="stat">

<div class="stat-title">
STAT ${i+1}
</div>

<input
type="hidden"
id="statId${i}"
value="${esc(id)}"
>

${input(
"Value",
"statValue"+i,
value
)}

${input(
"Label",
"statLabel"+i,
label
)}

${input(
"Sort Order",
"statSort"+i,
sort,
"number"
)}

<div class="actions">

<button
class="edit-btn"
onclick="saveStat(${i})">

✏️ EDIT / SAVE

</button>

${
id
?
`
<button
class="delete-btn"
onclick="deleteStat('${esc(id)}')">

🗑️ DELETE

</button>
`
:
""
}

</div>

</div>

`;

}


html+=`

</div>

`;

$("content").innerHTML=html;

return;

}


/* =====================================================
PROJECTS
===================================================== */

if(type==="projects"){

const {
data,
error
} =
await db
.from("projects")
.select("*")
.order(
"sort_order",
{ascending:true}
);


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>
Projects / Proof
</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


$("content").innerHTML=`

<div class="panel">

<h2>
Projects / Website Proof
</h2>

<p class="hint">
Add, edit and delete portfolio projects.
Database column for the live website is
<strong>url</strong>.
</p>

<button
class="add-btn"
onclick="openProjectForm()">

+ ADD PROJECT

</button>

<div id="projectForm"></div>

${
(data || []).length
?
(data || [])
.map(
(p,i)=>`

<div class="project">

<div class="project-number">
PROJECT ${i+1}
</div>


${
p.image_url
?
`
<img
class="preview"
src="${esc(p.image_url)}"
alt="${esc(p.title)}"
onerror="this.style.display='none'"
>
`
:
`
<div class="notice">
No image added
</div>
`
}


<input
type="hidden"
id="projectId${i}"
value="${esc(p.id)}"
>


${input(
"Category",
"projectCategory"+i,
p.category
)}


${input(
"Project Title",
"projectTitle"+i,
p.title
)}


${textarea(
"Description",
"projectDescription"+i,
p.description
)}


${input(
"Project Image URL",
"projectImage"+i,
p.image_url
)}


${input(
"Live Project URL",
"projectUrl"+i,
p.url
)}


${input(
"Sort Order",
"projectSort"+i,
p.sort_order ?? 99,
"number"
)}


<label>

<input
type="checkbox"
id="projectPublished${i}"
${p.published ? "checked" : ""}
>

Published

</label>


<div class="actions">

<button
class="edit-btn"
onclick="editProject(${i})">

✏️ EDIT / SAVE

</button>


<button
class="delete-btn"
onclick="deleteProject('${esc(p.id)}')">

🗑️ DELETE

</button>

</div>

</div>

`
)
.join("")
:
`
<div class="empty">
No projects found.
Click ADD PROJECT to create one.
</div>
`
}

</div>

`;

return;

}


/* =====================================================
OFFERS
===================================================== */

if(type==="offers"){

const {
data,
error
} =
await db
.from("offers")
.select("*")
.order(
"sort_order",
{ascending:true}
);


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>Offers</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


$("content").innerHTML=`

<div class="panel">

<h2>Offers</h2>

${
(data || []).length
?
(data || [])
.map(
(o,i)=>`

<div class="item">

<input
type="hidden"
id="offerId${i}"
value="${esc(o.id)}"
>

${input(
"Offer Text",
"offerText"+i,
o.text
)}

${input(
"Sort Order",
"offerSort"+i,
o.sort_order ?? 99,
"number"
)}

<label>

<input
type="checkbox"
id="offerEnabled${i}"
${o.enabled ? "checked" : ""}
>

Enabled

</label>


<div class="actions">

<button
class="edit-btn"
onclick="editOffer(${i})">

✏️ EDIT / SAVE

</button>

<button
class="delete-btn"
onclick="deleteOffer('${esc(o.id)}')">

🗑️ DELETE

</button>

</div>

</div>

`
)
.join("")
:
`
<div class="empty">
No offers found.
</div>
`
}


<button
class="add-btn"
onclick="openOfferForm()">

+ ADD OFFER

</button>

<div id="offerForm"></div>

</div>

`;

return;

}


/* =====================================================
ABOUT
===================================================== */

if(type==="about"){

const {
data,
error
} =
await db
.from("site_content")
.select("*")
.limit(1)
.maybeSingle();


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>About</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


const x=data || {};


$("content").innerHTML=`

<div class="panel">

<h2>About</h2>

${input(
"About Title",
"aboutTitle",
x.about_title
)}

${textarea(
"About Text",
"aboutText",
x.about_text
)}

<button
class="save-btn"
onclick="saveAbout()">

SAVE ABOUT

</button>

</div>

`;

return;

}


/* =====================================================
SERVICES
===================================================== */

if(type==="services"){

const {
data,
error
} =
await db
.from("services")
.select("*")
.order(
"sort_order",
{ascending:true}
);


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>Services</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


$("content").innerHTML=`

<div class="panel">

<h2>Services</h2>

<p class="hint">
Add, edit and delete portfolio services.
</p>

<button
class="add-btn"
onclick="openServiceForm()">

+ ADD SERVICE

</button>

<div id="serviceForm"></div>

${
(data || []).length
?
(data || [])
.map(
(s,i)=>`

<div class="item">

<input
type="hidden"
id="serviceId${i}"
value="${esc(s.id)}"
>

${input(
"Service Name",
"serviceTitle"+i,
s.title
)}

${input(
"Sort Order",
"serviceSort"+i,
s.sort_order ?? 99,
"number"
)}

<label>

<input
type="checkbox"
id="servicePublished${i}"
${s.published ? "checked" : ""}
>

Published

</label>


<div class="actions">

<button
class="edit-btn"
onclick="editService(${i})">

✏️ EDIT / SAVE

</button>

<button
class="delete-btn"
onclick="deleteService('${esc(s.id)}')">

🗑️ DELETE

</button>

</div>

</div>

`
)
.join("")
:
`
<div class="empty">
No services found.
</div>
`
}

</div>

`;

return;

}


/* =====================================================
CONTACT
===================================================== */

if(type==="contact"){

const {
data,
error
} =
await db
.from("site_content")
.select("*")
.limit(1)
.maybeSingle();


if(error){

$("content").innerHTML=`

<div class="panel">

<h2>Contact</h2>

<div class="notice">
${esc(error.message)}
</div>

</div>

`;

return;

}


const x=data || {};


$("content").innerHTML=`

<div class="panel">

<h2>Contact</h2>

${input(
"Contact Title",
"contactTitle",
x.contact_title
)}

${textarea(
"Contact Text",
"contactText",
x.contact_text
)}

<button
class="save-btn"
onclick="saveContact()">

SAVE CONTACT

</button>

</div>

`;

} =

}


/* =====================================================
STATS
===================================================== */

async function saveStat(index){

const id =
$("statId"+index).value.trim();

const value =
$("statValue"+index).value.trim();

const label =
$("statLabel"+index).value.trim();

const sort_order =
parseInt(
$("statSort"+index).value
) || index+1;


if(!value || !label){

alert(
"Value and Label are required."
);

return;

}


let result;


if(id){

result =
await db
.from("stats")
.update({

value:value,
label:label,
sort_order:sort_order

})
.eq("id",id);

}else{

result =
await db
.from("stats")
.insert({

value:value,
label:label,
sort_order:sort_order

});

}


if(result.error){

alert(result.error.message);
return;

}


alert(
id
?
"Stat updated successfully."
:
"Stat created successfully."
);


show(
"stats",
document.querySelector(
'.nav-btn[onclick*="stats"]'
)
);

}


async function deleteStat(id){

if(
!confirm(
"Delete this stat?"
)
)return;


const {
error
} =
await db
.from("stats")
.delete()
.eq("id",id);


if(error){

alert(error.message);
return;

}


alert("Stat deleted.");


show(
"stats",
document.querySelector(
'.nav-btn[onclick*="stats"]'
)
);

}
