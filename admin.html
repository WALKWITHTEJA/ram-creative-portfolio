<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM — Admin Panel</title>

<style>
*{box-sizing:border-box}

html{
 scroll-behavior:smooth
}

body{
 margin:0;
 background:#070707;
 color:#eee;
 font:14px Arial,sans-serif
}

button,
input,
textarea,
select{
 font:inherit
}

button{
 cursor:pointer
}

.hidden{
 display:none!important
}

.gold{
 color:#d9a83b
}

/* ================= LOGIN ================= */

.login{
 min-height:100vh;
 display:grid;
 place-items:center;
 padding:20px;
 background:
 radial-gradient(
  circle at center,
  #291e0c 0%,
  #070707 58%
 )
}

.login-box{
 width:min(430px,100%);
 padding:42px;
 background:#101010;
 border:1px solid #5a421d;
 box-shadow:0 20px 80px #000;
 text-align:center
}

.logo{
 font:bold 38px Georgia,serif;
 color:#d9a83b;
 letter-spacing:5px
}

.login-sub{
 color:#777;
 font-size:10px;
 letter-spacing:3px;
 margin:8px 0 25px
}

.field{
 width:100%;
 padding:14px;
 background:#080808;
 border:1px solid #392b16;
 color:#fff;
 margin:7px 0 15px;
 outline:none;
 border-radius:0
}

.field:focus{
 border-color:#d9a83b
}

textarea.field{
 resize:vertical;
 min-height:110px
}

.login-btn,
.save-btn{
 width:100%;
 padding:14px;
 background:#d9a83b;
 color:#111;
 border:0;
 font-weight:800
}

.login-btn:hover,
.save-btn:hover,
.edit-btn:hover,
.add-btn:hover{
 background:#efc35a
}

.msg{
 color:#e07878;
 font-size:12px;
 margin-top:12px;
 line-height:1.5
}

/* ================= APP ================= */

.app{
 display:flex;
 min-height:100vh
}

/* ================= SIDEBAR ================= */

.sidebar{
 width:245px;
 flex-shrink:0;
 background:#101010;
 border-right:1px solid #292116;
 padding:20px 12px;
 display:flex;
 flex-direction:column;
 gap:5px;
 position:sticky;
 top:0;
 height:100vh;
 overflow-y:auto
}

.sidebar-title{
 font:30px Georgia,serif;
 color:#d9a83b;
 margin:0 0 20px;
 padding:10px
}

.nav-btn,
.public-link{
 background:none;
 border:0;
 color:#aaa;
 text-align:left;
 padding:13px 12px;
 text-decoration:none;
 display:block;
 width:100%
}

.nav-btn:hover,
.nav-btn.active,
.public-link:hover{
 background:#1a150c;
 color:#e0b34d
}

.logout-btn{
 margin-top:auto
}

/* ================= MAIN ================= */

.main{
 flex:1;
 min-width:0;
 padding:26px;
 max-width:1500px;
 margin:auto;
 width:100%
}

.topbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #292116;
 padding-bottom:16px
}

.topbar h1{
 margin:0;
 font:36px Georgia,serif
}

.live{
 color:#d9a83b;
 font-size:11px;
 letter-spacing:2px
}

/* ================= CARDS ================= */

.cards{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
 margin-top:20px
}

.card{
 background:#111;
 border:1px solid #302617;
 padding:22px
}

.card b{
 display:block;
 font:38px Georgia,serif;
 color:#d9a83b;
 margin-bottom:8px
}

.card span{
 color:#888
}

/* ================= PANELS ================= */

.panel{
 background:#111;
 border:1px solid #302617;
 padding:22px;
 margin-top:18px
}

.panel h2{
 margin-top:0;
 color:#d9a83b;
 font:26px Georgia,serif
}

.hint{
 color:#888;
 line-height:1.7
}

.notice{
 background:#171107;
 border:1px solid #5d451d;
 color:#d9b86a;
 padding:13px;
 margin:15px 0;
 line-height:1.6
}

.error-box{
 background:#210d0d;
 border:1px solid #682020;
 color:#ff9b9b;
 padding:15px;
 margin-top:15px;
 line-height:1.6;
 white-space:pre-wrap
}

.success{
 color:#8fd18f;
 margin-top:10px
}

/* ================= ITEMS ================= */

.item{
 padding:20px 0;
 border-bottom:1px solid #302617
}

.item:last-child{
 border-bottom:0
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:12px
}

.edit-btn{
 background:#d9a83b;
 color:#111;
 border:0;
 padding:10px 14px;
 font-weight:800
}

.delete-btn{
 background:#4b1717;
 color:#fff;
 border:0;
 padding:10px 14px;
 font-weight:800
}

.add-btn{
 width:100%;
 margin-top:15px;
 padding:14px;
 background:#d9a83b;
 color:#111;
 border:0;
 font-weight:800
}

.cancel-btn{
 background:#333;
 color:#fff;
 border:0;
 padding:12px 18px;
 font-weight:700
}

/* ================= STATS ================= */

.stat{
 background:#0d0d0d;
 border:1px solid #302617;
 padding:20px;
 margin:15px 0
}

.stat-title{
 color:#d9a83b;
 font:24px Georgia,serif;
 margin-bottom:12px
}

/* ================= PROJECT ================= */

.project{
 background:#0d0d0d;
 border:1px solid #302617;
 padding:20px;
 margin:18px 0
}

.project-number{
 color:#d9a83b;
 font:24px Georgia,serif;
 margin-bottom:15px
}

.preview{
 width:100%;
 max-width:500px;
 height:260px;
 object-fit:cover;
 display:block;
 border:1px solid #3b2c18;
 margin:10px 0 18px;
 background:#080808
}

.form-box{
 background:#0d0d0d;
 border:1px solid #6e5220;
 padding:22px;
 margin-top:20px
}

.file-input{
 width:100%;
 padding:12px;
 background:#080808;
 color:#ddd;
 border:1px solid #392b16;
 margin:7px 0 15px
}

.file-status{
 color:#aaa;
 font-size:12px;
 margin:5px 0 10px
}

/* ================= TABLE LIKE ================= */

.empty{
 padding:30px 10px;
 color:#777;
 text-align:center;
 border:1px dashed #302617;
 margin-top:15px
}

/* ================= MOBILE ================= */

@media(max-width:900px){

 .sidebar{
  width:75px;
  padding:10px 6px
 }

 .sidebar-title{
  font-size:0;
  text-align:center
 }

 .sidebar-title:after{
  content:"R";
  font:bold 25px Georgia,serif;
  color:#d9a83b
 }

 .nav-btn,
 .public-link{
  font-size:0;
  text-align:center;
  padding:13px 5px
 }

 .nav-btn:before{
  content:"•";
  font-size:22px
 }

 .public-link:before{
  content:"↗";
  font-size:20px
 }

 .main{
  padding:14px
 }

 .cards{
  grid-template-columns:1fr 1fr
 }

}

@media(max-width:600px){

 .login-box{
  padding:28px 20px
 }

 .main{
  padding:10px
 }

 .topbar{
  flex-direction:column;
  align-items:flex-start;
  gap:8px
 }

 .topbar h1{
  font-size:29px
 }

 .cards{
  grid-template-columns:1fr 1fr;
  gap:8px
 }

 .card{
  padding:15px
 }

 .card b{
  font-size:30px
 }

 .panel{
  padding:15px
 }

 .preview{
  height:210px
 }

}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

</head>

<body>

<!-- =====================================================
LOGIN
===================================================== -->

<div id="login" class="login">

 <div class="login-box">

  <div class="logo">RAM</div>

  <div class="login-sub">
   FULL WEBSITE ADMIN
  </div>

  <input
   id="email"
   class="field"
   type="email"
   placeholder="Admin Email"
   autocomplete="email"
  >

  <input
   id="password"
   class="field"
   type="password"
   placeholder="Password"
   autocomplete="current-password"
  >

  <button
   class="login-btn"
   onclick="login()"
  >
   LOGIN
  </button>

  <div id="loginMsg" class="msg"></div>

 </div>

</div>


<!-- =====================================================
APP
===================================================== -->

<div id="app" class="app hidden">

 <aside class="sidebar">

  <h2 class="sidebar-title">RAM</h2>

  <button
   class="nav-btn active"
   onclick="show('dashboard',this)"
  >
   Dashboard
  </button>

  <button
   class="nav-btn"
   onclick="show('home',this)"
  >
   Home / Hero
  </button>

  <button
   class="nav-btn"
   onclick="show('stats',this)"
  >
   Stats
  </button>

  <button
   class="nav-btn"
   onclick="show('projects',this)"
  >
   Projects / Proof
  </button>

  <button
   class="nav-btn"
   onclick="show('offers',this)"
  >
   Offers
  </button>

  <button
   class="nav-btn"
   onclick="show('about',this)"
  >
   About
  </button>

  <button
   class="nav-btn"
   onclick="show('services',this)"
  >
   Services
  </button>

  <button
   class="nav-btn"
   onclick="show('contact',this)"
  >
   Contact
  </button>

  <button
   class="nav-btn"
   onclick="show('messages',this)"
  >
   Messages
  </button>

  <button
   class="nav-btn"
   onclick="show('settings',this)"
  >
   Account
  </button>

  <a
   class="public-link"
   href="index.html"
  >
   Public Website ↗
  </a>

  <button
   class="nav-btn logout-btn"
   onclick="logout()"
  >
   Logout
  </button>

 </aside>


 <main class="main">

  <div class="topbar">

   <h1 id="pageTitle">
    Dashboard
   </h1>

   <span class="live">
    LIVE DATABASE CMS
   </span>

  </div>

  <div id="content"></div>

 </main>

</div>


<script>

/* =====================================================
SUPABASE
===================================================== */

if(
 !window.SUPABASE_URL ||
 !window.SUPABASE_ANON_KEY
){

 document.body.innerHTML = `
 <div style="
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#070707;
  color:#fff;
  padding:25px;
  text-align:center;
  font-family:Arial;
 ">
  <div>
   <h2 style="color:#d9a83b">
    RAM Admin Configuration Error
   </h2>
   <p>
    SUPABASE_URL or SUPABASE_ANON_KEY
    is missing in config.js
   </p>
  </div>
 </div>
 `;

 throw new Error(
  "Missing Supabase configuration"
 );

}


const db =
 window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
 );


const $ =
 id => document.getElementById(id);


/* =====================================================
ESCAPE
===================================================== */

function esc(value){

 return String(value ?? "")
  .replace(
   /[&<>"']/g,
   function(m){

    return {
     "&":"&amp;",
     "<":"&lt;",
     ">":"&gt;",
     '"':"&quot;",
     "'":"&#039;"
    }[m];

   }
  );

}


/* =====================================================
ERROR
===================================================== */

function showError(
 title,
 error
){

 const message =
  error?.message ||
  String(error || "Unknown error");

 $("content").innerHTML = `

 <div class="panel">

  <h2>
   ${esc(title)}
  </h2>

  <div class="error-box">
   ${esc(message)}
  </div>

 </div>

 `;

}


/* =====================================================
INPUT HELPERS
===================================================== */

function input(
 label,
 id,
 value="",
 type="text"
){

 return `

 <label>
  ${esc(label)}
 </label>

 <input
  id="${esc(id)}"
  class="field"
  type="${esc(type)}"
  value="${esc(value)}"
 >

 `;

}


function textarea(
 label,
 id,
 value=""
){

 return `

 <label>
  ${esc(label)}
 </label>

 <textarea
  id="${esc(id)}"
  class="field"
  rows="5"
 >${esc(value)}</textarea>

 `;

}


/* =====================================================
LOGIN
===================================================== */

async function login(){

 const email =
  $("email").value.trim();

 const password =
  $("password").value;

 if(!email || !password){

  $("loginMsg").textContent =
   "Enter email and password.";

  return;

 }

 $("loginMsg").textContent =
  "Logging in...";


 const {
  data,
  error
 } =
 await db.auth.signInWithPassword({

  email:email,
  password:password

 });


 if(error){

  $("loginMsg").textContent =
   error.message;

  return;

 }


 if(!data.session){

  $("loginMsg").textContent =
   "Login failed. No session.";

  return;

 }


 $("login")
  .classList
  .add("hidden");

 $("app")
  .classList
  .remove("hidden");


 await show(
  "dashboard",
  document.querySelector(".nav-btn")
 );

}


/* =====================================================
LOGOUT
===================================================== */

async function logout(){

 await db.auth.signOut();

 location.reload();

}


/* =====================================================
NAVIGATION
===================================================== */

async function show(
 type,
 button
){

 document
  .querySelectorAll(".nav-btn")
  .forEach(
   x =>
    x.classList.remove("active")
  );


 if(button){
  button.classList.add("active");
 }


 const titles = {

  dashboard:"Dashboard",
  home:"Home / Hero",
  stats:"Stats",
  projects:"Projects / Proof",
  offers:"Offers",
  about:"About",
  services:"Services",
  contact:"Contact",
  messages:"Messages",
  settings:"Account Settings"

 };


 $("pageTitle").textContent =
  titles[type] || "Dashboard";


 $("content").innerHTML = `

 <div class="panel">
  <h2>Loading...</h2>
 </div>

 `;


 /* ===================================================
 DASHBOARD
 =================================================== */

 if(type === "dashboard"){

  const results =
   await Promise.all([

    db
     .from("projects")
     .select("id",{count:"exact",head:true}),

    db
     .from("services")
     .select("id",{count:"exact",head:true}),

    db
     .from("offers")
     .select("id",{count:"exact",head:true}),

    db
     .from("messages")
     .select("id",{count:"exact",head:true})

   ]);


  $("content").innerHTML = `

  <div class="cards">

   <div class="card">
    <b>${results[0].count ?? 0}</b>
    <span>Projects</span>
   </div>

   <div class="card">
    <b>${results[1].count ?? 0}</b>
    <span>Services</span>
   </div>

   <div class="card">
    <b>${results[2].count ?? 0}</b>
    <span>Offers</span>
   </div>

   <div class="card">
    <b>${results[3].count ?? 0}</b>
    <span>Messages</span>
   </div>

  </div>

  <div class="panel">

   <h2>
    Live Website Control
   </h2>

   <p class="hint">
    Changes saved here are stored in Supabase
    and can be displayed on the public website.
   </p>

   <div class="notice">
    RAM Creative Portfolio — Admin CMS
   </div>

  </div>

  `;

 }


 /* ===================================================
 HOME
 =================================================== */

 if(type === "home"){

  const {
   data,
   error
  } =
  await db
   .from("site_content")
   .select("*")
   .limit(1)
   .maybeSingle();


  if(error){

   showError(
    "Home / Hero",
    error
   );

   return;

  }


  const x =
   data || {};


  $("content").innerHTML = `

  <div class="panel">

   <h2>
    Home / Hero
   </h2>

   ${input(
    "Hero Eyebrow",
    "heroEyebrow",
    x.hero_eyebrow
   )}

   ${input(
    "Hero Title",
    "heroTitle",
    x.hero_title
   )}

   ${textarea(
    "Hero Description",
    "heroDescription",
    x.hero_description
   )}

   <button
    class="save-btn"
    onclick="saveHome()"
   >
    SAVE HOME
   </button>

   <div id="homeStatus"></div>

  </div>

  `;

 }


 /* ===================================================
 STATS
 =================================================== */

 if(type === "stats"){

  const {
   data,
   error
  } =
  await db
   .from("stats")
   .select("*")
   .order(
    "sort_order",
    {ascending:true}
   );


  if(error){

   showError(
    "Stats",
    error
   );

   return;

  }


  const defaults = [

   {
    value:"2+",
    label:"PROJECTS",
    sort_order:1
   },

   {
    value:"10+",
    label:"BRANDS",
    sort_order:2
   },

   {
    value:"1+",
    label:"YEARS CREATING",
    sort_order:3
   },

   {
    value:"100%",
    label:"PASSION",
    sort_order:4
   }

  ];


  const existing =
   data || [];


  /*
   Map by sort_order instead of array position.
  */

  const byOrder = {};

  existing.forEach(
   stat => {
    byOrder[
     Number(stat.sort_order)
    ] = stat;
   }
  );


  let html = `

  <div class="panel">

   <h2>
    Stats
   </h2>

   <div class="notice">
    Exactly 4 stats only.
    Edit or save each stat below.
    There is no Add Stat option.
   </div>

  `;


  for(
   let i=0;
   i<4;
   i++
  ){

   const order =
    i+1;

   const stat =
    byOrder[order];

   const d =
    defaults[i];


   html += `

   <div class="stat">

    <div class="stat-title">
     STAT ${order}
    </div>

    <input
     type="hidden"
     id="statId${i}"
     value="${esc(stat?.id || "")}"
    >

    ${input(
     "Value",
     "statValue"+i,
     stat?.value ?? d.value
    )}

    ${input(
     "Label",
     "statLabel"+i,
     stat?.label ?? d.label
    )}

    <input
     type="hidden"
     id="statSort${i}"
     value="${order}"
    >

    <div class="actions">

     <button
      class="edit-btn"
      onclick="saveStat(${i})"
     >
      ✏️ EDIT / SAVE
     </button>

     ${
      stat?.id
      ?
      `
       <button
        class="delete-btn"
        onclick="deleteStat('${esc(stat.id)}')"
       >
        🗑️ DELETE
       </button>
      `
      :
      ""
     }

    </div>

   </div>

   `;

  }


  html += `
  </div>
  `;


  $("content").innerHTML =
   html;

 }


 /* ===================================================
 PROJECTS
 =================================================== */

 if(type === "projects"){

  const {
   data,
   error
  } =
  await db
   .from("projects")
   .select("*")
   .order(
    "sort_order",
    {ascending:true}
   );


  if(error){

   showError(
    "Projects",
    error
   );

   return;

  }


  $("content").innerHTML = `

  <div class="panel">

   <h2>
    Projects / Website Proof
   </h2>

   <p class="hint">
    Add project title, description,
    live URL and project image.
   </p>

   <button
    class="add-btn"
    onclick="openProjectForm()"
   >
    + ADD PROJECT
   </button>

   <div id="projectForm"></div>

   ${
    (data || []).length
    ?
    (data || [])
     .map(
      (p,i)=>`

      <div class="project">

       <div class="project-number">
        PROJECT ${i+1}
       </div>

       ${
        p.image_url
        ?
        `
         <img
          class="preview"
          src="${esc(p.image_url)}"
          alt="${esc(p.title)}"
         >
        `
        :
        `
         <div class="notice">
          No project image
         </div>
        `
       }

       <input
        type="hidden"
        id="projectId${i}"
        value="${esc(p.id)}"
       >

       ${input(
        "Category",
        "projectCategory"+i,
        p.category
       )}

       ${input(
        "Project Title",
        "projectTitle"+i,
        p.title
       )}

       ${textarea(
        "Description",
        "projectDescription"+i,
        p.description
       )}

       ${input(
        "Project Image URL",
        "projectImage"+i,
        p.image_url
       )}

       <label>
        Upload New Project Image
       </label>

       <input
        class="file-input"
        type="file"
        accept="image/*"
        id="projectFile${i}"
       >

       <div
        id="projectUploadStatus${i}"
        class="file-status"
       ></div>

       ${input(
        "Live Project URL",
        "projectUrl"+i,
        p.live_url || p.url
       )}

       ${input(
        "Sort Order",
        "projectSort"+i,
        p.sort_order,
        "number"
       )}

       <label>
        <input
         type="checkbox"
         id="projectPublished${i}"
         ${p.published ? "checked" : ""}
        >
        Published
       </label>

       <div class="actions">

        <button
         class="edit-btn"
         onclick="editProject(${i})"
        >
         ✏️ EDIT / SAVE
        </button>

        <button
         class="delete-btn"
         onclick="deleteProject('${esc(p.id)}')"
        >
         🗑️ DELETE
        </button>

       </div>

      </div>

      `
     )
     .join("")
    :
    `
     <div class="empty">
      No projects yet.
     </div>
    `
   }

  </div>

  `;

 }


 /* ===================================================
 OFFERS
 =================================================== */

 if(type === "offers"){

  const {
   data,
   error
  } =
  await db
   .from("offers")
   .select("*")
   .order(
    "sort_order",
    {ascending:true}
   );


  if(error){

   showError(
    "Offers",
    error
   );

   return;

  }


  $("content").innerHTML = `

  <div class="panel">

   <h2>
    Offers
   </h2>

   ${
    (data || []).length
    ?
    data
     .map(
      (o,i)=>`

      <div class="item">

       <input
        type="hidden"
        id="offerId${i}"
        value="${esc(o.id)}"
       >

       ${input(
        "Offer Text",
        "offerText"+i,
        o.text
       )}

       ${input(
        "Sort Order",
        "offerSort"+i,
        o.sort_order,
        "number"
       )}

       <label>
        <input
         type="checkbox"

/* =====================================================
UPLOAD IMAGE
===================================================== */

async function uploadProjectImage(
 file
){

 if(!file){
  return null;
 }


 const extension =
  file.name
   .split(".")
   .pop()
   .toLowerCase();


 const safeName =
  file.name
   .replace(
    /[^a-zA-Z0-9._-]/g,
    "-"
   );


 const path =
  "projects/" +
  Date.now() +
  "-" +
  Math.random()
   .toString(36)
   .slice(2) +
  "-" +
  safeName;


 const {
  error
 } =
 await db.storage
  .from("project-images")
  .upload(
   path,
   file,
   {
    cacheControl:"3600",
    upsert:false,
    contentType:file.type
   }
  );


 if(error){

  throw error;

 }


 const {
  data
 } =
 db.storage
  .from("project-images")
  .getPublicUrl(path);


 return data.publicUrl;

}
