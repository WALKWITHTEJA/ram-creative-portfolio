<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM — Full Website Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#070707;color:#eee;font:14px Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}.hidden{display:none!important}.gold{color:#d9a83b}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#251b0b,#070707 55%)}
.box{width:min(430px,92%);padding:42px;background:#101010;border:1px solid #5a421d;text-align:center}
.logo{font:bold 36px Georgia;color:#d9a83b;letter-spacing:4px}.box p{color:#777;font-size:10px;letter-spacing:3px}
.field{width:100%;padding:13px;margin:7px 0 15px;background:#080808;border:1px solid #392b16;color:#fff;border-radius:4px}
.box button,.save{width:100%;padding:13px;background:#d9a83b;color:#111;border:0;font-weight:800;border-radius:4px}
.app{display:flex;min-height:100vh}.side{width:245px;background:#101010;border-right:1px solid #292116;padding:20px 12px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.side h2{font:30px Georgia;color:#d9a83b;margin:0 0 20px;padding:10px}
.side button,.side a{background:none;border:0;color:#aaa;text-align:left;padding:12px;text-decoration:none;border-radius:4px}
.side button:hover,.side a:hover,.side .active{background:#1a150c;color:#e0b34d}
.main{flex:1;padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292116;padding-bottom:16px}
.top h1{font:36px Georgia;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.card,.panel{background:#111;border:1px solid #302617;padding:22px}.card b{display:block;font:38px Georgia;color:#d9a83b;margin-bottom:7px}
.panel{margin-top:18px}.panel h2{font:25px Georgia;color:#d9a83b;margin:0 0 15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.item{padding:20px 0;border-bottom:1px solid #302617}.item:last-child{border-bottom:0}
.small,.hint{font-size:11px;color:#888;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:0;padding:10px 15px;border-radius:4px;font-weight:700}.edit{background:#d9a83b;color:#111}.danger{background:#571919;color:#fff}.secondary{background:#292116;color:#ddd}
.check{display:flex;align-items:center;gap:8px;color:#aaa;margin:8px 0}.check input{width:auto}
.preview{width:190px;height:125px;object-fit:cover;border:1px solid #4b381b;background:#080808;display:block;margin:10px 0}
.upload{border:1px dashed #6f5220;padding:15px;margin:10px 0 15px;background:#0b0b0b}
.upload input{width:100%;color:#aaa;margin:8px 0}.status{margin-top:8px;color:#9c9}
.link{display:inline-block;color:#d9a83b;word-break:break-all;margin:5px 0 10px}
@media(max-width:760px){.side{width:68px;padding:10px 6px}.side h2{font-size:0;text-align:center}.side h2:after{content:"R";font:bold 25px Georgia;color:#d9a83b}.side button,.side a{font-size:0;text-align:center}.side button:before{content:"•";font-size:20px}.main{padding:14px}.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>
<body>

<div id="login" class="login">
<div class="box">
<div class="logo">RAM</div>
<p>FULL WEBSITE ADMIN</p>
<input id="email" class="field" type="email" placeholder="Admin Email">
<input id="password" class="field" type="password" placeholder="Password">
<button onclick="login()">LOGIN</button>
<p id="loginMsg" class="small"></p>
</div>
</div>

<div id="app" class="app hidden">
<aside class="side">
<h2>RAM</h2>
<button class="active" onclick="showPage('dashboard',this)">Dashboard</button>
<button onclick="showPage('home',this)">Home / Hero</button>
<button onclick="showPage('stats',this)">Stats</button>
<button onclick="showPage('projects',this)">Projects / Proof</button>
<button onclick="showPage('offers',this)">Offers</button>
<button onclick="showPage('about',this)">About</button>
<button onclick="showPage('services',this)">Services</button>
<button onclick="showPage('contact',this)">Contact</button>
<button onclick="showPage('messages',this)">Messages</button>
<button onclick="showPage('settings',this)">Account</button>
<a href="index.html">Public Website ↗</a>
<button onclick="logout()">Logout</button>
</aside>
<main class="main">
<div class="top"><h1 id="title">Dashboard</h1><span class="gold">LIVE DATABASE CMS</span></div>
<div id="content"></div>
</main>
</div>

<script>
const db=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function inp(label,id,v="",type="text"){
return `<label>${esc(label)}</label><input id="${id}" class="field" type="${type}" value="${esc(v)}">`;
}
function ta(label,id,v=""){
return `<label>${esc(label)}</label><textarea id="${id}" class="field" rows="4">${esc(v)}</textarea>`;
}

async function login(){
const email=$("email").value.trim(),password=$("password").value;
if(!email||!password){$("loginMsg").textContent="Enter email and password.";return}
const {error}=await db.auth.signInWithPassword({email,password});
if(error){$("loginMsg").textContent=error.message;return}
$("login").classList.add("hidden");$("app").classList.remove("hidden");
showPage("dashboard",document.querySelector(".side button"));
}
async function logout(){await db.auth.signOut();location.reload()}

async function showPage(type,btn){
document.querySelectorAll(".side button").forEach(x=>x.classList.remove("active"));
if(btn)btn.classList.add("active");
const titles={dashboard:"Dashboard",home:"Home / Hero",stats:"Stats",projects:"Projects / Proof",offers:"Offers",about:"About",services:"Services",contact:"Contact",messages:"Messages",settings:"Account Settings"};
$("title").textContent=titles[type]||"Dashboard";
$("content").innerHTML='<div class="panel"><h2>Loading...</h2></div>';
if(type==="dashboard")return dashboard();
if(type==="home")return home();
if(type==="stats")return stats();
if(type==="projects")return projects();
if(type==="offers")return offers();
if(type==="about")return about();
if(type==="services")return services();
if(type==="contact")return contact();
if(type==="messages")return messages();
if(type==="settings")return settings();
}

async function dashboard(){
const [p,s,o,m]=await Promise.all([
db.from("projects").select("id",{count:"exact",head:true}),
db.from("services").select("id",{count:"exact",head:true}),
db.from("offers").select("id",{count:"exact",head:true}),
db.from("messages").select("id",{count:"exact",head:true})
]);
$("content").innerHTML=`<div class="cards">
<div class="card"><b>${p.count??0}</b>Projects</div>
<div class="card"><b>${s.count??0}</b>Services</div>
<div class="card"><b>${o.count??0}</b>Offers</div>
<div class="card"><b>${m.count??0}</b>Messages</div>
</div><div class="panel"><h2>Live Website Control</h2><p class="hint">Changes saved here are stored in Supabase and displayed on the public website.</p></div>`;
}

async function siteRow(){
const {data,error}=await db.from("site_content").select("*").limit(1).maybeSingle();
if(error)throw error;return data;
}

async function home(){
try{
const x=await siteRow()||{};
$("content").innerHTML=`<div class="panel"><h2>Home / Hero</h2>
${inp("Hero Eyebrow","he",x.hero_eyebrow)}
${inp("Hero Title — use | for gold part","ht",x.hero_title)}
${ta("Hero Description","hd",x.hero_description)}
<button class="save" onclick="saveHome()">SAVE HOME</button></div>`;
}catch(e){errorBox(e)}
}
async function saveHome(){
try{const x=await siteRow();if(!x)return alert("site_content row not found.");
const {error}=await db.from("site_content").update({hero_eyebrow:$("he").value,hero_title:$("ht").value,hero_description:$("hd").value}).eq("id",x.id);
if(error)throw error;alert("Home saved.");}catch(e){alert(e.message)}
}

async function stats(){
const {data,error}=await db.from("stats").select("*").order("sort_order");
if(error)return errorBox(error);
$("content").innerHTML=`<div class="panel"><h2>Stats</h2><button class="btn edit" onclick="addStat()">+ ADD STAT</button>
${(data||[]).map((x,i)=>`<div class="item">${inp("Value","sv"+i,x.value)}${inp("Label","sl"+i,x.label)}${inp("Sort Order","ss"+i,x.sort_order,"number")}
<div class="actions"><button class="btn edit" onclick="editStat('${x.id}',${i})">✏️ SAVE</button><button class="btn danger" onclick="deleteStat('${x.id}')">🗑️ DELETE</button></div></div>`).join("")}</div>`;
}
async function addStat(){
const value=prompt("Value:","25+");if(value===null)return;
const label=prompt("Label:","PROJECTS");if(label===null)return;
const {error}=await db.from("stats").insert({value,label,sort_order:99});
if(error)alert(error.message);else stats();
}
async function editStat(id,i){
const {error}=await db.from("stats").update({value:$("sv"+i).value,label:$("sl"+i).value,sort_order:Number($("ss"+i).value)||99}).eq("id",id);
if(error)alert(error.message);else alert("Stat saved.");
}
async function deleteStat(id){
if(!confirm("Delete stat?"))return;
const {error}=await db.from("stats").delete().eq("id",id);
if(error)alert(error.message);else stats();
}

async function projects(){
const {data,error}=await db.from("projects").select("*").order("sort_order");
if(error)return errorBox(error);
$("content").innerHTML=`<div class="panel"><h2>Website Proof / Projects</h2>
<p class="hint">Image + live project link + title + description. Add, edit and delete from here.</p>
<button class="btn edit" onclick="addProject()">+ ADD PROJECT</button>
${(data||[]).map((x,i)=>`
<div class="item">
<div class="item-title">PROJECT ${i+1}</div>
<input id="pid${i}" type="hidden" value="${esc(x.id)}">
${x.image_url?`<img id="prev${i}" class="preview" src="${esc(x.image_url)}" alt="Project">`:`<div id="prev${i}" class="preview" style="display:grid;place-items:center;color:#777">NO IMAGE</div>`}
<div class="upload">
<label>Project Image</label>
<input id="file${i}" type="file" accept="image/*" onchange="preview(${i})">
<button class="btn secondary" type="button" onclick="uploadImage(${i})">⬆ UPLOAD IMAGE</button>
<div id="up${i}" class="status"></div>
</div>
${inp("Category","pc"+i,x.category)}
${inp("Project Title","pt"+i,x.title)}
${ta("Description","pd"+i,x.description)}
${inp("Live Project URL","pu"+i,x.project_url||"","url")}
${x.project_url?`<a class="link" href="${esc(x.project_url)}" target="_blank" rel="noopener">🔗 ${esc(x.project_url)}</a>`:""}
${inp("Sort Order","ps"+i,x.sort_order,"number")}
<label class="check"><input id="pub${i}" type="checkbox" ${x.published?"checked":""}> Published</label>
<div class="actions">
<button class="btn edit" onclick="saveProject(${i})">✏️ SAVE / EDIT</button>
<button class="btn danger" onclick="deleteProject('${esc(x.id)}')">🗑️ DELETE</button>
</div>
</div>`).join("")}</div>`;
}

function preview(i){
const f=$("file"+i).files[0];if(!f)return;
const url=URL.createObjectURL(f);const old=$("prev"+i);
if(old.tagName==="IMG")old.src=url;
else old.outerHTML=`<img id="prev${i}" class="preview" src="${url}" alt="Preview">`;
}

async function uploadImage(i){
const file=$("file"+i).files[0];if(!file)return alert("Select an image first.");
const id=$("pid"+i).value;
$("up"+i).textContent="Uploading...";
const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
const path="projects/"+id+"-"+Date.now()+"."+ext;
const {error}=await db.storage.from("project-images").upload(path,file,{cacheControl:"3600",upsert:false});
if(error){$("up"+i).textContent=error.message;return alert(error.message);}
const {data}=db.storage.from("project-images").getPublicUrl(path);
const {error:updateError}=await db.from("projects").update({image_url:data.publicUrl}).eq("id",id);
if(updateError){$("up"+i).textContent=updateError.message;return alert(updateError.message);}
$("up"+i).textContent="Image uploaded successfully.";
await projects();
}

async function saveProject(i){
const id=$("pid"+i).value;
const {error}=await db.from("projects").update({
category:$("pc"+i).value,
title:$("pt"+i).value,
description:$("pd"+i).value,
project_url:$("pu"+i).value,
sort_order:Number($("ps"+i).value)||99,
published:$("pub"+i).checked
}).eq("id",id);
if(error)alert(error.message);else{alert("Project saved.");projects();}
}
async function addProject(){
const {error}=await db.from("projects").insert({category:"WEBSITE",title:"New Project",description:"Project description",project_url:"",image_url:"",sort_order:99,published:true});
if(error)alert(error.message);else projects();
}
async function deleteProject(id){
if(!confirm("Delete this project permanently?"))return;
const {error}=await db.from("projects").delete().eq("id",id);
if(error)alert(error.message);else projects();
}

async function offers(){
const {data,error}=await db.from("offers").select("*").order("sort_order");
if(error)return errorBox(error);
$("content").innerHTML=`<div class="panel"><h2>Running Offers</h2><button class="btn edit" onclick="addOffer()">+ ADD OFFER</button>
${(data||[]).map((x,i)=>`<div class="item">${ta("Offer Text","ot"+i,x.text)}
${inp("Sort Order","os"+i,x.sort_order,"number")}
<label class="check"><input id="oe"+i type="checkbox" ${x.enabled?"checked":""}> Enabled</label>
<div class="actions"><button class="btn edit" onclick="editOffer('${x.id}',${i})">✏️ SAVE / EDIT</button><button class="btn danger" onclick="deleteOffer('${x.id}')">🗑️ DELETE</button></div></div>`).join("")}</div>`;
}
async function addOffer(){
const {error}=await db.from("offers").insert({text:"🔥 NEW SPECIAL OFFER",enabled:true,sort_order:99});
if(error)alert(error.message);else offers();
}
async function editOffer(id,i){
const {error}=await db.from("offers").update({text:$("ot"+i).value,enabled:$("oe"+i).checked,sort_order:Number($("os"+i).value)||99}).eq("id",id);
if(error)alert(error.message);else alert("Offer saved.");
}
async function deleteOffer(id){
if(!confirm("Delete offer?"))return;
const {error}=await db.from("offers").delete().eq("id",id);
if(error)alert(error.message);else offers();
}

async function about(){
try{const x=await siteRow()||{};$("content").innerHTML=`<div class="panel"><h2>About</h2>${inp("About Title — use | for gold part","abt",x.about_title)}${ta("About Text","abx",x.about_text)}<button class="save" onclick="saveAbout()">SAVE ABOUT</button></div>`}catch(e){errorBox(e)}
}
async function saveAbout(){
try{const x=await siteRow();const {error}=await db.from("site_content").update({about_title:$("abt").value,about_text:$("abx").value}).eq("id",x.id);if(error)throw error;alert("About saved.")}catch(e){alert(e.message)}
}

async function services(){
const {data,error}=await db.from("services").select("*").order("sort_order");
if(error)return errorBox(error);
$("content").innerHTML=`<div class="panel"><h2>Services</h2><button class="btn edit" onclick="addService()">+ ADD SERVICE</button>
${(data||[]).map((x,i)=>`<div class="item">${inp("Service","st"+i,x.title)}${inp("Sort Order","ssv"+i,x.sort_order,"number")}
<label class="check"><input id="se"+i type="checkbox" ${x.published?"checked":""}> Published</label>
<div class="actions"><button class="btn edit" onclick="editService('${x.id}',${i})">✏️ SAVE / EDIT</button><button class="btn danger" onclick="deleteService('${x.id}')">🗑️ DELETE</button></div></div>`).join("")}</div>`;
}
async function addService(){
const {error}=await db.from("services").insert({title:"NEW SERVICE",published:true,sort_order:99});
if(error)alert(error.message);else services();
}
async function editService(id,i){
const {error}=await db.from("services").update({title:$("st"+i).value,published:$("se"+i).checked,sort_order:Number($("ssv"+i).value)||99}).eq("id",id);
if(error)alert(error.message);else alert("Service saved.");
}
async function deleteService(id){
if(!confirm("Delete service?"))return;
const {error}=await db.from("services").delete().eq("id",id);
if(error)alert(error.message);else services();
}

async function contact(){
try{const x=await siteRow()||{};$("content").innerHTML=`<div class="panel"><h2>Contact</h2>${inp("Contact Title — use | for gold part","ct",x.contact_title)}${ta("Contact Text","cx",x.contact_text)}<button class="save" onclick="saveContact()">SAVE CONTACT</button></div>`}catch(e){errorBox(e)}
}
async function saveContact(){
try{const x=await siteRow();const {error}=await db.from("site_content").update({contact_title:$("ct").value,contact_text:$("cx").value}).eq("id",x.id);if(error)throw error;alert("Contact saved.")}catch(e){alert(e.message)}
}

async function messages(){
const {data,error}=await db.from("messages").select("*").order("created_at",{ascending:false});
if(error)return errorBox(error);
$("content").innerHTML=`<div class="panel"><h2>Message Requests</h2>${(data||[]).length?(data||[]).map(x=>`<div class="item"><b>${esc(x.name)}</b><p>📱 ${esc(x.phone)}</p><p>✉️ ${esc(x.email)}</p><p>${esc(x.message)}</p><span class="small">${esc(x.created_at)}</span><div class="actions"><button class="btn danger" onclick="deleteMessage('${esc(x.id)}')">🗑️ DELETE</button></div></div>`).join(""):`<p class="small">No messages yet.</p>`}</div>`;
}
async function deleteMessage(id){
if(!confirm("Delete message?"))return;
const {error}=await db.from("messages").delete().eq("id",id);
if(error)alert(error.message);else messages();
}

async function settings(){
const {data:{user}}=await db.auth.getUser();
$("content").innerHTML=`<div class="panel"><h2>Account Settings</h2><p class="small">Current: ${esc(user?.email||"")}</p>
${inp("New Email","newEmail",user?.email||"","email")}
${inp("New Password","newPassword","","password")}
${inp("Confirm Password","confirmPassword","","password")}
<button class="save" onclick="saveSettings()">SAVE ACCOUNT</button></div>`;
}
async function saveSettings(){
const email=$("newEmail").value.trim(),password=$("newPassword").value,confirm=$("confirmPassword").value;
if(password&&password!==confirm)return alert("Passwords do not match.");
const payload={};if(email)payload.email=email;if(password)payload.password=password;
if(!Object.keys(payload).length)return alert("Nothing to update.");
const {error}=await db.auth.updateUser(payload);
if(error)alert(error.message);else alert("Account updated.");
}

function errorBox(e){
$("content").innerHTML=`<div class="panel"><h2>Error</h2><p class="hint">${esc(e?.message||"Unknown error")}</p></div>`;
}

(async()=>{
const {data:{session}}=await db.auth.getSession();
if(session){
$("login").classList.add("hidden");
$("app").classList.remove("hidden");
showPage("dashboard",document.querySelector(".side button"));
}
})();
</script>
</body>
</html>
