<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAM — Admin Panel</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#070707;color:#eee;font:14px Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.gold{color:#d9a83b}

.login{
 min-height:100vh;display:grid;place-items:center;
 background:radial-gradient(circle,#251b0b,#070707 55%)
}
.login-box{
 width:min(430px,92%);padding:42px;background:#101010;
 border:1px solid #5a421d;text-align:center
}
.logo{font:bold 38px Georgia;color:#d9a83b;letter-spacing:5px}
.login-sub{color:#777;font-size:10px;letter-spacing:3px;margin-bottom:25px}

.field{
 width:100%;padding:13px;background:#080808;
 border:1px solid #392b16;color:#fff;margin:7px 0 15px;
 outline:none
}
.field:focus{border-color:#d9a83b}

.login-btn,.save-btn{
 width:100%;padding:13px;background:#d9a83b;
 color:#111;border:0;font-weight:800
}
.msg{color:#d66;font-size:12px;margin-top:12px}

.app{display:flex;min-height:100vh}

.sidebar{
 width:245px;flex-shrink:0;background:#101010;
 border-right:1px solid #292116;padding:20px 12px;
 display:flex;flex-direction:column;gap:5px
}
.sidebar-title{
 font:30px Georgia;color:#d9a83b;margin:0 0 20px;padding:10px
}
.nav-btn,.public-link{
 background:none;border:0;color:#aaa;text-align:left;
 padding:12px;text-decoration:none
}
.nav-btn:hover,.nav-btn.active,.public-link:hover{
 background:#1a150c;color:#e0b34d
}

.main{flex:1;min-width:0;padding:26px}

.topbar{
 display:flex;justify-content:space-between;align-items:center;
 border-bottom:1px solid #292116;padding-bottom:16px
}
.topbar h1{margin:0;font:36px Georgia}
.live{color:#d9a83b;font-size:11px;letter-spacing:2px}

.cards{
 display:grid;grid-template-columns:repeat(4,1fr);
 gap:14px;margin-top:20px
}
.card{background:#111;border:1px solid #302617;padding:22px}
.card b{display:block;font:38px Georgia;color:#d9a83b}

.panel{
 background:#111;border:1px solid #302617;
 padding:22px;margin-top:18px
}
.panel h2{margin-top:0;color:#d9a83b;font:26px Georgia}
.hint{color:#888;line-height:1.7}
.notice{
 background:#171107;border:1px solid #5d451d;
 color:#d9b86a;padding:13px;margin:15px 0
}

.item{padding:20px 0;border-bottom:1px solid #302617}
.item:last-child{border-bottom:0}

.actions{
 display:flex;flex-wrap:wrap;gap:8px;margin-top:12px
}
.edit-btn{
 background:#d9a83b;color:#111;border:0;
 padding:10px 14px;font-weight:800
}
.delete-btn{
 background:#4b1717;color:#fff;border:0;
 padding:10px 14px;font-weight:800
}
.add-btn{
 width:100%;margin-top:15px;padding:14px;
 background:#d9a83b;color:#111;border:0;font-weight:800
}

.stat{
 background:#0d0d0d;border:1px solid #302617;
 padding:20px;margin:15px 0
}
.stat-title{color:#d9a83b;font:24px Georgia;margin-bottom:12px}

.project{
 background:#0d0d0d;border:1px solid #302617;
 padding:20px;margin:18px 0
}
.project-number{color:#d9a83b;font:24px Georgia;margin-bottom:15px}
.preview{
 width:100%;max-width:430px;height:230px;
 object-fit:cover;display:block;border:1px solid #3b2c18;
 margin:10px 0 18px
}
.project-form{
 background:#0d0d0d;border:1px solid #6e5220;
 padding:22px;margin-top:20px
}

@media(max-width:760px){
 .sidebar{width:68px;padding:10px 6px}
 .sidebar-title{font-size:0;text-align:center}
 .sidebar-title:after{
  content:"R";font:bold 25px Georgia;color:#d9a83b
 }
 .nav-btn,.public-link{font-size:0;text-align:center}
 .nav-btn:before{content:"•";font-size:20px}
 .main{padding:14px}
 .cards{grid-template-columns:1fr 1fr}
 .topbar{flex-direction:column;align-items:flex-start;gap:8px}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="login">
<div class="login-box">

<div class="logo">RAM</div>
<div class="login-sub">FULL WEBSITE ADMIN</div>

<input id="email" class="field" type="email" placeholder="Admin Email">
<input id="password" class="field" type="password" placeholder="Password">

<button class="login-btn" onclick="login()">LOGIN</button>

<div id="loginMsg" class="msg"></div>

</div>
</div>


<!-- APP -->
<div id="app" class="app hidden">

<aside class="sidebar">

<h2 class="sidebar-title">RAM</h2>

<button class="nav-btn active" onclick="show('dashboard',this)">Dashboard</button>
<button class="nav-btn" onclick="show('home',this)">Home / Hero</button>
<button class="nav-btn" onclick="show('stats',this)">Stats</button>
<button class="nav-btn" onclick="show('projects',this)">Projects / Proof</button>
<button class="nav-btn" onclick="show('offers',this)">Offers</button>
<button class="nav-btn" onclick="show('about',this)">About</button>
<button class="nav-btn" onclick="show('services',this)">Services</button>
<button class="nav-btn" onclick="show('contact',this)">Contact</button>
<button class="nav-btn" onclick="show('messages',this)">Messages</button>
<button class="nav-btn" onclick="show('settings',this)">Account</button>

<a class="public-link" href="index.html">Public Website ↗</a>

<button class="nav-btn" onclick="logout()">Logout</button>

</aside>


<main class="main">

<div class="topbar">
<h1 id="pageTitle">Dashboard</h1>
<span class="live">LIVE DATABASE CMS</span>
</div>

<div id="content"></div>

</main>
</div>


<script>

const db=window.supabase.createClient(
 window.SUPABASE_URL,
 window.SUPABASE_ANON_KEY
);

const $=id=>document.getElementById(id);

const esc=v=>String(v??"").replace(
 /[&<>"']/g,
 m=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#039;"
 }[m])
);

function input(label,id,value="",type="text"){
 return `
 <label>${esc(label)}</label>
 <input id="${id}" class="field"
 type="${type}" value="${esc(value)}">
 `;
}

function textarea(label,id,value=""){
 return `
 <label>${esc(label)}</label>
 <textarea id="${id}" class="field"
 rows="4">${esc(value)}</textarea>
 `;
}


/* LOGIN */

async function login(){

 const {error}=await db.auth.signInWithPassword({
  email:$("email").value.trim(),
  password:$("password").value
 });

 if(error){
  $("loginMsg").textContent=error.message;
  return;
 }

 $("login").classList.add("hidden");
 $("app").classList.remove("hidden");

 show(
  "dashboard",
  document.querySelector(".nav-btn")
 );
}


async function logout(){
 await db.auth.signOut();
 location.reload();
}


/* NAVIGATION */

async function show(type,button){

 document.querySelectorAll(".nav-btn")
 .forEach(x=>x.classList.remove("active"));

 if(button)button.classList.add("active");

 const titles={
  dashboard:"Dashboard",
  home:"Home / Hero",
  stats:"Stats",
  projects:"Projects / Proof",
  offers:"Offers",
  about:"About",
  services:"Services",
  contact:"Contact",
  messages:"Messages",
  settings:"Account Settings"
 };

 $("pageTitle").textContent=titles[type]||"Dashboard";

 $("content").innerHTML=`
 <div class="panel">
 <h2>Loading...</h2>
 </div>`;



/* DASHBOARD */

if(type==="dashboard"){

 const [p,s,o,m]=await Promise.all([

  db.from("projects").select("id",{count:"exact",head:true}),
  db.from("services").select("id",{count:"exact",head:true}),
  db.from("offers").select("id",{count:"exact",head:true}),
  db.from("messages").select("id",{count:"exact",head:true})

 ]);

 $("content").innerHTML=`

 <div class="cards">

 <div class="card">
 <b>${p.count??0}</b>
 Projects
 </div>

 <div class="card">
 <b>${s.count??0}</b>
 Services
 </div>

 <div class="card">
 <b>${o.count??0}</b>
 Offers
 </div>

 <div class="card">
 <b>${m.count??0}</b>
 Messages
 </div>

 </div>

 <div class="panel">
 <h2>Live Website Control</h2>
 <p class="hint">
 Changes saved here are stored in Supabase
 and displayed on the public website.
 </p>
 </div>
 `;

}


/* HOME */

if(type==="home"){

 const {data}=await db
 .from("site_content")
 .select("*")
 .limit(1)
 .maybeSingle();

 const x=data||{};

 $("content").innerHTML=`

 <div class="panel">

 <h2>Home / Hero</h2>

 ${input("Hero Eyebrow","heroEyebrow",x.hero_eyebrow)}

 ${input("Hero Title","heroTitle",x.hero_title)}

 ${textarea(
  "Hero Description",
  "heroDescription",
  x.hero_description
 )}

 <button class="save-btn" onclick="saveHome()">
 SAVE HOME
 </button>

 </div>
 `;

}


/* =================================================
   STATS — ALWAYS SHOW 4 SLOTS
================================================= */

if(type==="stats"){

 const {data,error}=await db
 .from("stats")
 .select("*")
 .order("sort_order",{ascending:true});

 if(error){

  $("content").innerHTML=`
  <div class="panel">
  <h2>Stats</h2>
  <p class="hint">${esc(error.message)}</p>
  </div>`;

  return;
 }


 const existing=data||[];


 /*
  IMPORTANT:
  Even if database has only 1 record,
  UI will ALWAYS show 4 cards.
 */

 const defaults=[

  {
   value:"2+",
   label:"PROJECTS",
   sort_order:1
  },

  {
   value:"10+",
   label:"BRANDS",
   sort_order:2
  },

  {
   value:"1+",
   label:"YEARS CREATING",
   sort_order:3
  },

  {
   value:"100%",
   label:"PASSION",
   sort_order:4
  }

 ];


 let html=`

 <div class="panel">

 <h2>Stats — 4 Options</h2>

 <div class="notice">
 EXACTLY 4 STATS.  
 Add button is not required.
 Missing stats will be created automatically
 when you press SAVE.
 </div>
 `;


 for(let i=0;i<4;i++){

  const stat=existing[i];

  const value=
   stat?.value ??
   defaults[i].value;

  const label=
   stat?.label ??
   defaults[i].label;

  const sort=
   stat?.sort_order ??
   defaults[i].sort_order;

  const id=
   stat?.id ??
   "";


  html+=`

  <div class="stat">

  <div class="stat-title">
   STAT ${i+1}
  </div>

  <input
   type="hidden"
   id="statId${i}"
   value="${esc(id)}">

  ${input(
   "Value",
   "statValue"+i,
   value
  )}

  ${input(
   "Label",
   "statLabel"+i,
   label
  )}

  ${input(
   "Sort Order",
   "statSort"+i,
   sort,
   "number"
  )}

  <div class="actions">

  <button
   class="edit-btn"
   onclick="saveStat(${i})">

   ✏️ EDIT / SAVE

  </button>

  ${
   id
   ?
   `<button
      class="delete-btn"
      onclick="deleteStat('${esc(id)}')">

      🗑️ DELETE

    </button>`
   :
   ""
  }

  </div>

  </div>
  `;
 }


 html+=`

 </div>
 `;

 $("content").innerHTML=html;

}


/* PROJECTS */

if(type==="projects"){

 const {data,error}=await db
 .from("projects")
 .select("*")
 .order("sort_order",{ascending:true});

 if(error){

  $("content").innerHTML=`
  <div class="panel">
  <h2>Projects</h2>
  <p class="hint">${esc(error.message)}</p>
  </div>`;

  return;
 }


 $("content").innerHTML=`

 <div class="panel">

 <h2>Projects / Website Proof</h2>

 <p class="hint">
 Add, edit, delete projects.
 Image URL and live project URL supported.
 </p>

 <button
 class="add-btn"
 onclick="openProjectForm()">

 + ADD PROJECT

 </button>

 <div id="projectForm"></div>

 ${
  (data||[]).map((p,i)=>`

  <div class="project">

  <div class="project-number">
  PROJECT ${i+1}
  </div>

  ${
   p.image_url
   ?
   `<img
    class="preview"
    src="${esc(p.image_url)}"
    alt="${esc(p.title)}">`
   :
   `<div class="notice">
    No image added
   </div>`
  }

  <input
   type="hidden"
   id="projectId${i}"
   value="${esc(p.id)}">

  ${input(
   "Category",
   "projectCategory"+i,
   p.category
  )}

  ${input(
   "Project Title",
   "projectTitle"+i,
   p.title
  )}

  ${textarea(
   "Description",
   "projectDescription"+i,
   p.description
  )}

  ${input(
   "Project Image URL",
   "projectImage"+i,
   p.image_url
  )}

  ${input(
   "Live Project URL",
   "projectUrl"+i,
   p.live_url||p.url
  )}

  ${input(
   "Sort Order",
   "projectSort"+i,
   p.sort_order,
   "number"
  )}

  <label>
  <input
   type="checkbox"
   id="projectPublished${i}"
   ${p.published?"checked":""}>
  Published
  </label>

  <div class="actions">

  <button
   class="edit-btn"
   onclick="editProject(${i})">
   ✏️ EDIT / SAVE
  </button>

  <button
   class="delete-btn"
   onclick="deleteProject('${esc(p.id)}')">
   🗑️ DELETE
  </button>

  </div>

  </div>

  `).join("")
 }

 </div>
 `;

}


/* OFFERS */

if(type==="offers"){

 const {data,error}=await db
 .from("offers")
 .select("*")
 .order("sort_order",{ascending:true});

 if(error){

  $("content").innerHTML=`
  <div class="panel">
  <h2>Offers</h2>
  <p class="hint">${esc(error.message)}</p>
  </div>`;

  return;
 }


 $("content").innerHTML=`

 <div class="panel">

 <h2>Offers</h2>

 ${
  (data||[]).map((o,i)=>`

  <div class="item">

  <input
   type="hidden"
   id="offerId${i}"
   value="${esc(o.id)}">

  ${input(
   "Offer Text",
   "offerText"+i,
   o.text
  )}

  ${input(
   "Sort Order",
   "offerSort"+i,
   o.sort_order,
   "number"
  )}

  <label>
  <input
   type="checkbox"
   id="offerEnabled${i}"
   ${o.enabled?"checked":""}>
  Enabled
  </label>

  <div class="actions">

  <button
   class="edit-btn"
   onclick="editOffer(${i})">
   ✏️ EDIT / SAVE
  </button>

  <button
   class="delete-btn"
   onclick="deleteOffer('${esc(o.id)}')">
   🗑️ DELETE
  </button>

  </div>

  </div>

  `).join("")
 }

 <button
  class="add-btn"
  onclick="addOffer()">
  + ADD OFFER
 </button>

 </div>
 `;

}


/* ABOUT */

if(type==="about"){

 const {data}=await db
 .from("site_content")
 .select("*")
 .limit(1)
 .maybeSingle();

 const x=data||{};

 $("content").innerHTML=`

 <div class="panel">

 <h2>About</h2>

 ${input(
  "About Title",
  "aboutTitle",
  x.about_title
 )}

 ${textarea(
  "About Text",
  "aboutText",
  x.about_text
 )}

 <button
  class="save-btn"
  onclick="saveAbout()">
  SAVE ABOUT
 </button>

 </div>
 `;

}


/* SERVICES */

if(type==="services"){

 const {data,error}=await db
 .from("services")
 .select("*")
 .order("sort_order",{ascending:true});

 if(error){

  $("content").innerHTML=`
  <div class="panel">
  <h2>Services</h2>
  <p class="hint">${esc(error.message)}</p>
  </div>`;

  return;
 }


 $("content").innerHTML=`

 <div class="panel">

 <h2>Services</h2>

 ${
  (data||[]).map((s,i)=>`

  <div class="item">

  <input
   type="hidden"
   id="serviceId${i}"
   value="${esc(s.id)}">

  ${input(
   "Service",
   "serviceTitle"+i,
   s.title
  )}

  ${input(
   "Sort Order",
   "serviceSort"+i,
   s.sort_order,
   "number"
  )}

  <label>
  <input
   type="checkbox"
   id="servicePublished${i}"
   ${s.published?"checked":""}>
  Published
  </label>

  <div class="actions">

  <button
   class="edit-btn"
   onclick="editService(${i})">
   ✏️ EDIT / SAVE
  </button>

  <button
   class="delete-btn"
   onclick="deleteService('${esc(s.id)}')">
   🗑️ DELETE
  </button>

  </div>

  </div>

  `).join("")
 }

 <button
  class="add-btn"
  onclick="addService()">
  + ADD SERVICE
 </button>

 </div>
 `;

}


/* CONTACT */

if(type==="contact"){

 const {data}=await db
 .from("site_content")
 .select("*")
 .limit(1)
 .maybeSingle();

 const x=data||{};

 $("content").innerHTML=`

 <div class="panel">

 <h2>Contact</h2>

 ${input(
  "Contact Title",
  "contactTitle",
  x.contact_title
 )}

 ${textarea(
  "Contact Text",
  "contactText",
  x.contact_text
 )}

 <button
  class="save-btn"
  onclick="saveContact()">
  SAVE CONTACT
 </button>

 </div>
 `;

}


/* MESSAGES */

if(type==="messages"){

 const {data,error}=await db
 .from("messages")
 .select("*")
 .order(
  "created_at",
  {ascending:false}
 );

 if(error){

  $("content").innerHTML=`
  <div class="panel">
  <h2>Messages</h2>
  <p class="hint">${esc(error.message)}</p>
  </div>`;

  return;
 }


 $("content").innerHTML=`

 <div class="panel">

 <h2>Message Requests</h2>

 ${
  (data||[]).map(m=>`

  <div class="item">

  <b>${esc(m.name)}</b>

  <p>📱 ${esc(m.phone)}</p>

  <p>✉️ ${esc(m.email)}</p>

  <p>${esc(m.message)}</p>

  <span class="hint">
  ${esc(m.created_at)}
  </span>

  </div>

  `).join("")
 }

 </div>
 `;

}


/* SETTINGS */

if(type==="settings"){

 const {data:user}=await db.auth.getUser();

 $("content").innerHTML=`

 <div class="panel">

 <h2>Account Settings</h2>

 <p class="hint">
 Current:
 ${esc(user.user?.email||"")}
 </p>

 ${input(
  "New Email",
  "newEmail",
  user.user?.email||"",
  "email"
 )}

 ${input(
  "New Password",
  "newPassword",
  "",
  "password"
 )}

 ${input(
  "Confirm Password",
  "confirmPassword",
  "",
  "password"
 )}

 <button
  class="save-btn"
  onclick="saveSettings()">
  SAVE ACCOUNT
 </button>

 </div>
 `;

}

}


/* =====================================================
   SAVE STAT — UPDATE OR INSERT
===================================================== */

async function saveStat(index){

 const id=$("statId"+index).value.trim();

 const value=$("statValue"+index).value.trim();

 const label=$("statLabel"+index).value.trim();

 const sort_order=
  parseInt(
   $("statSort"+index).value
  ) || index+1;


 if(!value||!label){

  alert(
   "Value and Label are required."
  );

  return;
 }


 let result;


 if(id){

  /* Existing stat */

  result=await db
   .from("stats")
   .update({
    value,
    label,
    sort_order
   })
   .eq("id",id);

 }else{

  /* Missing stat — CREATE IT */

  result=await db
   .from("stats")
   .insert({
    value,
    label,
    sort_order
   });

 }


 if(result.error){

  alert(result.error.message);

  return;
 }


 alert(
  "Stat "+(id?"updated":"created")+" successfully."
 );


 show(
  "stats",
  document.querySelector(
   '.nav-btn[onclick*="stats"]'
  )
 );

}


/* =====================================================
   DELETE STAT
===================================================== */

async function deleteStat(id){

 if(
  !confirm(
   "Delete this stat?"
  )
 )return;


 const {error}=await db
 .from("stats")
 .delete()
 .eq("id",id);


 if(error){

  alert(error.message);

  return;
 }


 alert("Stat deleted.");


 show(
  "stats",
  document.querySelector(
   '.nav-btn[onclick*="stats"]'
  )
 );

}


/* =====================================================
   HOME
===================================================== */

async function saveHome(){

 const {data}=await db
 .from("site_content")
 .select("id")
 .limit(1)
 .maybeSingle();


 if(!data){

  alert(
   "site_content record not found."
  );

  return;
 }


 const {error}=await db
 .from("site_content")
 .update({

  hero_eyebrow:
   $("heroEyebrow").value,

  hero_title:
   $("heroTitle").value,

  hero_description:
   $("heroDescription").value

 })
 .eq("id",data.id);


 if(error){

  alert(error.message);

  return;
 }


 alert("Home saved.");

}


/* =====================================================
   PROJECT EDIT
===================================================== */

async function editProject(index){

 const id=
  $("projectId"+index).value;


 const {error}=await db
 .from("projects")
 .update({

  category:
   $("projectCategory"+index).value,

  title:
   $("projectTitle"+index).value,

  description:
   $("projectDescription"+index).value,

  image_url:
   $("projectImage"+index).value,

  live_url:
   $("projectUrl"+index).value,

  sort_order:
   parseInt(
    $("projectSort"+index).value
   )||0,

  published:
   $("projectPublished"+index).checked

 })
 .eq("id",id);


 if(error){

  alert(error.message);

  return;
 }


 alert(
  "Project updated successfully."
 );

}


/* =====================================================
   PROJECT ADD FORM
===================================================== */

function openProjectForm(){

 $("projectForm").innerHTML=`

 <div class="project-form">

 <h2>Add New Project</h2>

 ${input(
  "Category",
  "newProjectCategory",
  "01 • WEBSITE"
 )}

 ${input(
  "Project Title",
  "newProjectTitle",
  ""
 )}

 ${textarea(
  "Description",
  "newProjectDescription",
  ""
 )}

async function createProject(){

 const title=
  $("newProjectTitle")
  .value.trim();


 if(!title){

  alert(
   "Project title is required."
  );

  return;
 }


 const {error}=await db
 .from("projects")
 .insert({

  category:
   $("newProjectCategory").value,

  title:title,

  description:
   $("newProjectDescription").value,

  image_url:
   $("newProjectImage").value,

  live_url:
   $("newProjectUrl").value,

  sort_order:
   parseInt(
    $("newProjectSort").value
   )||99,

  published:
   $("newProjectPublished").checked

 });


 if(error){

  alert(error.message);

  return;
 }


 alert(
  "Project added successfully."
 );


 show(
  "projects",
  document.querySelector(
   '.nav-btn[onclick*="projects"]'
  )
 );

}


/* PROJECT DELETE */

async function deleteProject(id){

 if(
  !confirm(
   "Delete this project permanently?"
  )
 )return;


 const {error}=await db
 .from("projects")
 .delete()
 .eq("id",id);


 if(error){

  alert(error.message);

  return;
 }


 alert("Project deleted.");


 show(
  "projects",
  document.querySelector(
   '.nav-btn[onclick*="projects"]'
  )
 );

}

/* ABOUT */

async function saveAbout(){

 const {data}=await db
 .from("site_content")
 .select("id")
 .limit(1)
 .maybeSingle();


 if(!data){

  alert(
   "site_content record not found."
  );

  return;
 }


 const {error}=await db
 .from("site_content")
 .update({

  about_title:
   $("aboutTitle").value,

  about_text:
   $("aboutText").value

 })
 .eq("id",data.id);


 if(error){

  alert(error.message);

  return;
 }


 alert("About saved.");

}

/* ACCOUNT */

async function saveSettings(){

 const email=
  $("newEmail").value.trim();

 const password=
  $("newPassword").value;

 const confirm=
  $("confirmPassword").value;


 if(
  password &&
  password!==confirm
 ){

  alert(
   "Passwords do not match."
  );

  return;
 }


 const payload={};


 if(email)
  payload.email=email;

 if(password)
  payload.password=password;


 if(
  !payload.email &&
  !payload.password
 ){

  alert(
   "Enter new email or password."
  );

  return;
 }


 const {error}=await db
 .auth
 .updateUser(payload);


 if(error){

  alert(error.message);

  return;
 }


 alert(
  "Account updated successfully."
 );

}
